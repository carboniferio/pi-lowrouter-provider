name: Publish

# Stages a release on npm through trusted publishing (GitHub OIDC): no stored
# token, and the package gets a provenance attestation. A staged version is not
# installable until a maintainer approves it with 2FA on npmjs.com (or
# `npm stage approve <stage-id>`). Run from the Actions tab once main carries the
# new version and a fresh snapshot (`npm run gen:catalog`). Leave dry_run on to
# preview.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; nothing is published.
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stage
        run: npm stage publish --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
